name: negadice
description: >-
  Index sheet (contact sheet) generator for scanned film. One sheet, one roll.
  Flutter desktop port of the Tauri original.
publish_to: "none"
version: 26.7.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # Japanese strings for Material widgets the app does not draw itself —
  # currently the date picker behind the 日付 field.
  flutter_localizations:
    sdk: flutter
  # JPEG encoding — dart:ui rasterizes, package:image writes the file.
  image: ^4.5.4
  # Native open-file / choose-directory dialogs on desktop.
  file_selector: ^1.0.3
  # OS drag-and-drop of files onto the window.
  desktop_drop: ^0.6.0
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    # Google Sans Flex (SIL OFL 1.1) carries Latin; Noto Sans JP (SIL OFL 1.1)
    # is the fallback that supplies CJK. Both are embedded, so there is no
    # runtime font lookup and a sheet renders identically on every machine.
    # See assets/fonts/OFL-*.txt.
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-Bold.ttf
          weight: 700
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
